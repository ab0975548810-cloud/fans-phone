name: Retry POS V1.5.5 mood themes
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v155-themes-retry.yml
permissions:
  contents: write
jobs:
  apply-v155:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch theme feature
        shell: bash
        run: |
          python - <<'PY'
          import base64
          exec(base64.b64decode(''))
          PY
      - name: Validate Python JavaScript and HTML
        shell: bash
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          import re
          h = Path('templates/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', h, re.S | re.I)
          Path('/tmp/pos-inline.js').write_text('\n'.join(x for x in scripts if x.strip()), encoding='utf-8')
          ids = re.findall(r'\bid=["\']([^"\']+)["\']', h)
          dupes = sorted({x for x in ids if ids.count(x) > 1})
          assert not dupes, f'duplicate ids: {dupes}'
          assert h.count('data-pos-theme-choice=') == 6
          assert 'fans_phone_pos_theme' in h
          assert 'randomizePosTheme' in h
          assert '#reportCaptureArea, #handwrittenReportContainer' in h
          assert 'APP_VERSION = "1.5.5"' in Path('app.py').read_text(encoding='utf-8')
          assert '"version": "1.5.5"' in Path('version.json').read_text(encoding='utf-8')
          PY
          node --check /tmp/pos-inline.js
      - name: Commit V1.5.5
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/index.html version.json README.md
          git commit -m "feat: add per-device mood themes in V1.5.5"
          git push origin main
