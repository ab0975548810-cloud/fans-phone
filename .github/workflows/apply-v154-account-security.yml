name: Apply POS V1.5.4 account PIN protection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v154-account-security.yml

permissions:
  contents: write

jobs:
  apply-v154:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch account security
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          app = Path('app.py')
          s = app.read_text(encoding='utf-8')
          s = s.replace('APP_VERSION = "1.5.3"', 'APP_VERSION = "1.5.4"', 1)

          partners_pattern = re.compile(
              r'@app\.route\("/api/partners", methods=\["GET", "POST", "DELETE"\]\)\ndef handle_partners\(\):\n.*?(?=\n\ndef recalc_product_stock\(cursor, product_id\):)',
              re.S,
          )
          partners_new = '''@app.route("/api/partners", methods=["GET", "POST", "DELETE"])
          def handle_partners():
              conn = get_db_connection()
              try:
                  cursor = conn.cursor()
                  if request.method == "GET":
                      rows = cursor.execute("SELECT id, name FROM partners ORDER BY id ASC").fetchall()
                      return jsonify([dict(r) for r in rows])

                  if not session.get("partner_id"):
                      return jsonify({"message": "請先登入"}), 401

                  if request.method == "POST":
                      if not _recently_reauthed():
                          return jsonify({"message": "人員資料異動前需要再次輸入目前使用者 PIN", "code": "reauth_required"}), 403

                      data = request.get_json() or {}
                      pid = data.get("id")
                      name = str(data.get("name", "")).strip()
                      pin = str(data.get("password", "")).strip()
                      if not name:
                          return jsonify({"message": "使用者名稱不可空白"}), 400

                      try:
                          if pid:
                              try:
                                  pid_int = int(pid)
                              except (TypeError, ValueError):
                                  return jsonify({"message": "使用者編號錯誤"}), 400
                              target = cursor.execute("SELECT id, name FROM partners WHERE id=?", (pid_int,)).fetchone()
                              if not target:
                                  return jsonify({"message": "找不到此使用者"}), 404
                              is_self = int(session.get("partner_id")) == pid_int

                              # 身分 PIN 只能本人修改。不能先重設別人的 PIN 再冒用該帳號。
                              if pin and not is_self:
                                  log_action(cursor, "阻擋 PIN 修改", f"嘗試修改其他使用者 PIN：{target['name']}")
                                  conn.commit()
                                  return jsonify({"message": "⛔ 不能修改其他使用者的 PIN；PIN 只能由本人登入後修改", "code": "target_pin_forbidden"}), 403

                              if pin:
                                  if len(pin) < 6:
                                      return jsonify({"message": "PIN 至少 6 碼"}), 400
                                  cursor.execute(
                                      "UPDATE partners SET name=?, password_hash=? WHERE id=?",
                                      (name, generate_password_hash(pin), pid_int),
                                  )
                              else:
                                  cursor.execute("UPDATE partners SET name=? WHERE id=?", (name, pid_int))

                              if is_self:
                                  session["partner_name"] = name
                              log_action(cursor, "使用者管理", f"編輯：{target['name']} → {name}" + ("；本人修改 PIN" if pin else ""))
                          else:
                              if len(pin) < 6:
                                  return jsonify({"message": "新增使用者時 PIN 至少 6 碼"}), 400
                              cursor.execute(
                                  "INSERT INTO partners (name, password_hash) VALUES (?, ?)",
                                  (name, generate_password_hash(pin)),
                              )
                              log_action(cursor, "使用者管理", f"新增：{name}")

                          conn.commit()
                          return jsonify({"status": "success"})
                      except sqlite3.IntegrityError:
                          conn.rollback()
                          return jsonify({"message": "使用者名稱已存在"}), 400

                  if not _recently_reauthed():
                      return jsonify({"message": "刪除使用者前需要再次輸入目前使用者 PIN", "code": "reauth_required"}), 403
                  pid = request.args.get("id")
                  try:
                      pid_int = int(pid)
                  except (TypeError, ValueError):
                      return jsonify({"message": "使用者編號錯誤"}), 400
                  if pid_int == int(session.get("partner_id")):
                      return jsonify({"message": "不能刪除目前正在登入的帳號；請先由其他使用者登入再操作"}), 400
                  if cursor.execute("SELECT COUNT(*) FROM partners").fetchone()[0] <= 1:
                      return jsonify({"message": "至少保留一位使用者"}), 400
                  old = cursor.execute("SELECT name FROM partners WHERE id=?", (pid_int,)).fetchone()
                  if not old:
                      return jsonify({"message": "找不到此使用者"}), 404
                  cursor.execute("DELETE FROM partners WHERE id=?", (pid_int,))
                  log_action(cursor, "刪除使用者", old["name"])
                  conn.commit()
                  return jsonify({"status": "success"})
              finally:
                  conn.close()
          '''
          s, n = partners_pattern.subn(partners_new, s, count=1)
          if n != 1:
              raise SystemExit('handle_partners patch failed')
          app.write_text(s, encoding='utf-8')

          html = Path('templates/index.html')
          h = html.read_text(encoding='utf-8')

          h = h.replace("let storeDisplayName = '配件 POS';", "let storeDisplayName = '配件 POS';\n    let currentPartnerName = '';", 1)
          h = h.replace(
              "document.getElementById('headerPartnerName').innerText = `👋 ${auth.partner} - `;",
              "currentPartnerName = auth.partner || '';\n        document.getElementById('headerPartnerName').innerText = `👋 ${auth.partner} - `;",
              1,
          )

          open_old = '''    function openPartnerModal() {
                  document.getElementById('editPartnerId').value = '';
                  document.getElementById('newPartnerName').value = '';
                  document.getElementById('newPartnerPwd').value = '';
                  document.getElementById('savePartnerBtn').innerText = '新增';
                  loadPeople(); partnerModalObj.show();
              }'''
          open_new = '''    function openPartnerModal() {
                  document.getElementById('editPartnerId').value = '';
                  document.getElementById('newPartnerName').value = '';
                  const pinEl = document.getElementById('newPartnerPwd');
                  pinEl.value = '';
                  pinEl.disabled = false;
                  pinEl.placeholder = '設定 PIN（至少 6 碼）';
                  document.getElementById('savePartnerBtn').innerText = '新增';
                  loadPeople(); partnerModalObj.show();
              }'''
          if open_old not in h:
              raise SystemExit('openPartnerModal marker not found')
          h = h.replace(open_old, open_new, 1)

          edit_old = '''    function editPartner(id, name) {
                  document.getElementById('editPartnerId').value = id;
                  document.getElementById('newPartnerName').value = name;
                  document.getElementById('newPartnerPwd').value = '';
                  document.getElementById('savePartnerBtn').innerText = '💾 儲存修改';
              }'''
          edit_new = '''    function editPartner(id, name) {
                  document.getElementById('editPartnerId').value = id;
                  document.getElementById('newPartnerName').value = name;
                  const pinEl = document.getElementById('newPartnerPwd');
                  pinEl.value = '';
                  const isSelf = name === currentPartnerName;
                  pinEl.disabled = !isSelf;
                  pinEl.placeholder = isSelf ? '修改自己的 PIN（至少 6 碼；不改可留白）' : '🔒 只有本人可以修改自己的 PIN';
                  document.getElementById('savePartnerBtn').innerText = '💾 儲存修改';
              }'''
          if edit_old not in h:
              raise SystemExit('editPartner marker not found')
          h = h.replace(edit_old, edit_new, 1)

          save_old = '''        const payload = {name, password: pwd}; if(id) payload.id = id;
                  const res = await fetch('/api/partners', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});'''
          save_new = '''        if(!await ensureSensitiveAuth()) return;
                  const payload = {name, password: pwd}; if(id) payload.id = id;
                  const res = await fetch('/api/partners', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});'''
          if save_old not in h:
              raise SystemExit('savePartner marker not found')
          h = h.replace(save_old, save_new, 1)
          html.write_text(h, encoding='utf-8')

          Path('version.json').write_text(json.dumps({
              'version': '1.5.4',
              'release_notes': '修正人員權限漏洞：其他使用者的 PIN 不可被重設；新增/編輯人員需再次驗證目前登入者 PIN；本人才能修改自己的 PIN；禁止刪除目前登入中的帳號。'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = Path('README.md')
          if readme.exists():
              r = readme.read_text(encoding='utf-8').replace('V1.5.3', 'V1.5.4')
              if '## V1.5.4 人員 PIN 保護' not in r:
                  r += '''\n## V1.5.4 人員 PIN 保護\n\n- 每位使用者只能修改自己的 PIN。\n- 其他人的 PIN 欄位會鎖定，後端也會拒絕跨帳號 PIN 修改。\n- 新增或編輯人員前要重新輸入目前登入者 PIN。\n- 刪除人員仍需二次驗證，且不能刪除目前正在登入的帳號。\n'''
              readme.write_text(r, encoding='utf-8')
          PY

      - name: Validate Python and JavaScript
        shell: bash
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          import re
          h = Path('templates/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', h, re.S | re.I)
          inline = '\n'.join(x for x in scripts if x.strip())
          Path('/tmp/pos-inline.js').write_text(inline, encoding='utf-8')
          assert '只有本人可以修改自己的 PIN' in h
          assert "if(!await ensureSensitiveAuth()) return;" in h
          s = Path('app.py').read_text(encoding='utf-8')
          assert 'APP_VERSION = "1.5.4"' in s
          assert 'target_pin_forbidden' in s
          PY
          node --check /tmp/pos-inline.js

      - name: Commit V1.5.4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/index.html version.json README.md
          git commit -m "fix: protect user PIN ownership in V1.5.4"
          git push origin main
