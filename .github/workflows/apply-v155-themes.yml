name: Apply POS V1.5.5 mood themes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v155-themes.yml

permissions:
  contents: write

jobs:
  apply-v155:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch V1.5.5 themes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          app = Path('app.py')
          s = app.read_text(encoding='utf-8')
          if 'APP_VERSION = "1.5.4"' not in s:
              raise SystemExit('expected V1.5.4 app version not found')
          s = s.replace('APP_VERSION = "1.5.4"', 'APP_VERSION = "1.5.5"', 1)
          app.write_text(s, encoding='utf-8')

          html = Path('templates/index.html')
          h = html.read_text(encoding='utf-8')

          old_css = ''':root { --pos-pink: #E83E8C; --pos-pink-dark: #C2185B; }
        body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif; }'''
          new_css = ''':root {
            --pos-pink: #E83E8C;
            --pos-pink-dark: #C2185B;
            --pos-bg: #f8f9fa;
            --pos-surface: #ffffff;
            --pos-text: #212529;
            --pos-border: #dee2e6;
            --pos-muted: #6c757d;
        }
        body[data-pos-theme="pink"] { --pos-pink:#E83E8C; --pos-pink-dark:#C2185B; --pos-bg:#f8f9fa; --pos-surface:#ffffff; --pos-text:#212529; --pos-border:#dee2e6; --pos-muted:#6c757d; }
        body[data-pos-theme="blue"] { --pos-pink:#1976D2; --pos-pink-dark:#0D47A1; --pos-bg:#F4F8FC; --pos-surface:#ffffff; --pos-text:#172033; --pos-border:#D7E3F2; --pos-muted:#64748B; }
        body[data-pos-theme="mint"] { --pos-pink:#2F9E7A; --pos-pink-dark:#176B57; --pos-bg:#F2FBF7; --pos-surface:#ffffff; --pos-text:#17352C; --pos-border:#CFE9DF; --pos-muted:#607D73; }
        body[data-pos-theme="latte"] { --pos-pink:#A8744F; --pos-pink-dark:#6F4E37; --pos-bg:#FAF6F1; --pos-surface:#FFFDFC; --pos-text:#3C2F2A; --pos-border:#E6D8CB; --pos-muted:#7B6B61; }
        body[data-pos-theme="purple"] { --pos-pink:#7E57C2; --pos-pink-dark:#512DA8; --pos-bg:#F7F3FC; --pos-surface:#ffffff; --pos-text:#2F2440; --pos-border:#DED2EF; --pos-muted:#71647F; }
        body[data-pos-theme="dark"] { --pos-pink:#8B7CFF; --pos-pink-dark:#6757D9; --pos-bg:#14151A; --pos-surface:#1F2128; --pos-text:#F5F5F5; --pos-border:#343842; --pos-muted:#B5BAC5; color-scheme:dark; }
        body { background-color: var(--pos-bg); color: var(--pos-text); font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif; transition: background-color .2s ease, color .2s ease; }
        .theme-picker-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:.5rem; }
        .theme-option { border:2px solid var(--pos-border); background:var(--pos-surface); color:var(--pos-text); border-radius:.75rem; padding:.65rem .45rem; font-weight:700; text-align:center; cursor:pointer; transition:.15s; }
        .theme-option:hover { transform:translateY(-1px); }
        .theme-option.active { border-color:var(--pos-pink); box-shadow:0 0 0 2px color-mix(in srgb, var(--pos-pink) 20%, transparent); }
        .theme-swatch { width:24px; height:24px; border-radius:50%; display:inline-block; vertical-align:middle; margin-right:.35rem; border:2px solid rgba(255,255,255,.75); box-shadow:0 0 0 1px rgba(0,0,0,.14); }
        body[data-pos-theme="dark"] .modal-content,
        body[data-pos-theme="dark"] .card,
        body[data-pos-theme="dark"] .list-group-item { background-color:var(--pos-surface); color:var(--pos-text); border-color:var(--pos-border); }
        body[data-pos-theme="dark"] .bg-white,
        body[data-pos-theme="dark"] .bg-light,
        body[data-pos-theme="dark"] .table-light { background-color:#242730 !important; color:var(--pos-text) !important; }
        body[data-pos-theme="dark"] .text-dark { color:#F5F5F5 !important; }
        body[data-pos-theme="dark"] .text-secondary { color:var(--pos-muted) !important; }
        body[data-pos-theme="dark"] .form-control,
        body[data-pos-theme="dark"] .form-select { background-color:#191B21; color:#F5F5F5; border-color:var(--pos-border); }
        body[data-pos-theme="dark"] .form-control::placeholder { color:#8F96A3; }
        body[data-pos-theme="dark"] .table { --bs-table-bg:transparent; --bs-table-color:#F5F5F5; --bs-table-border-color:var(--pos-border); }
        body[data-pos-theme="dark"] .nav-tabs .nav-link { color:#D7DAE0; }
        body[data-pos-theme="dark"] .nav-tabs .nav-link.active { background-color:var(--pos-surface); color:var(--pos-pink); border-color:var(--pos-border) var(--pos-border) var(--pos-surface); }
        body[data-pos-theme="dark"] .smart-dropdown-menu,
        body[data-pos-theme="dark"] .variant-sheet { background-color:var(--pos-surface); color:var(--pos-text); }
        body[data-pos-theme="dark"] .smart-dropdown-item { color:var(--pos-text); border-color:var(--pos-border); }
        #reportCaptureArea, #handwrittenReportContainer { --pos-pink:#E83E8C; --pos-pink-dark:#C2185B; }
        body[data-pos-theme="dark"] #reportCaptureArea,
        body[data-pos-theme="dark"] #reportCaptureArea .bg-white,
        body[data-pos-theme="dark"] #reportCaptureArea .bg-light,
        body[data-pos-theme="dark"] #reportCaptureArea .table-light { background-color:#ffffff !important; color:#212529 !important; }
        body[data-pos-theme="dark"] #reportCaptureArea .text-dark { color:#212529 !important; }
        body[data-pos-theme="dark"] #reportCaptureArea .text-secondary { color:#6c757d !important; }
        @media (max-width: 576px) { .theme-picker-grid { grid-template-columns:repeat(2, minmax(0,1fr)); } }'''
          if old_css not in h:
              raise SystemExit('theme css marker not found')
          h = h.replace(old_css, new_css, 1)

          settings_old = '''                <div id="paymentMethodSettingsList" class="d-flex flex-wrap gap-2"></div>
                <hr>
                <div class="fw-bold mb-2">🛠️ 系統與備份</div>'''
          settings_new = '''                <div id="paymentMethodSettingsList" class="d-flex flex-wrap gap-2"></div>
                <hr>
                <div class="fw-bold mb-2">🎨 介面主題</div>
                <div class="small text-secondary mb-2">只會改這台裝置的 POS 外觀，不會影響其他手機／平板；營業報表仍維持原本粉色品牌。</div>
                <div class="theme-picker-grid mb-2" id="posThemePicker">
                    <button type="button" class="theme-option" data-pos-theme-choice="pink" onclick="selectPosTheme('pink')"><span class="theme-swatch" style="background:#E83E8C"></span>櫻花粉</button>
                    <button type="button" class="theme-option" data-pos-theme-choice="blue" onclick="selectPosTheme('blue')"><span class="theme-swatch" style="background:#1976D2"></span>海洋藍</button>
                    <button type="button" class="theme-option" data-pos-theme-choice="mint" onclick="selectPosTheme('mint')"><span class="theme-swatch" style="background:#2F9E7A"></span>薄荷綠</button>
                    <button type="button" class="theme-option" data-pos-theme-choice="latte" onclick="selectPosTheme('latte')"><span class="theme-swatch" style="background:#A8744F"></span>奶茶棕</button>
                    <button type="button" class="theme-option" data-pos-theme-choice="purple" onclick="selectPosTheme('purple')"><span class="theme-swatch" style="background:#7E57C2"></span>葡萄紫</button>
                    <button type="button" class="theme-option" data-pos-theme-choice="dark" onclick="selectPosTheme('dark')"><span class="theme-swatch" style="background:#1F2128"></span>🌙 深色</button>
                </div>
                <div class="d-flex justify-content-between align-items-center gap-2 p-2 border rounded mb-2">
                    <span class="small">目前：<strong id="currentPosThemeText">櫻花粉</strong></span>
                    <button type="button" class="btn btn-sm btn-outline-secondary fw-bold" onclick="randomizePosTheme()">🎲 今日心情隨機</button>
                </div>
                <hr>
                <div class="fw-bold mb-2">🛠️ 系統與備份</div>'''
          if settings_old not in h:
              raise SystemExit('settings theme marker not found')
          h = h.replace(settings_old, settings_new, 1)

          js_marker = "    let csrfToken = '';\n"
          theme_js = '''    const POS_THEME_KEY = 'fans_phone_pos_theme';
    const POS_THEMES = {
        pink: {name:'櫻花粉'},
        blue: {name:'海洋藍'},
        mint: {name:'薄荷綠'},
        latte: {name:'奶茶棕'},
        purple: {name:'葡萄紫'},
        dark: {name:'🌙 深色模式'}
    };
    let currentPosTheme = 'pink';

    function renderPosThemePicker() {
        document.querySelectorAll('[data-pos-theme-choice]').forEach(btn => {
            const active = btn.dataset.posThemeChoice === currentPosTheme;
            btn.classList.toggle('active', active);
            btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        const label = document.getElementById('currentPosThemeText');
        if(label) label.textContent = (POS_THEMES[currentPosTheme] || POS_THEMES.pink).name;
    }

    function applyPosTheme(theme, persist = true) {
        const safeTheme = POS_THEMES[theme] ? theme : 'pink';
        currentPosTheme = safeTheme;
        document.body.setAttribute('data-pos-theme', safeTheme);
        if(persist) {
            try { localStorage.setItem(POS_THEME_KEY, safeTheme); } catch(e) {}
        }
        renderPosThemePicker();
    }

    function initPosTheme() {
        let saved = 'pink';
        try { saved = localStorage.getItem(POS_THEME_KEY) || 'pink'; } catch(e) {}
        applyPosTheme(saved, false);
    }

    function selectPosTheme(theme) { applyPosTheme(theme, true); }

    function randomizePosTheme() {
        const choices = Object.keys(POS_THEMES).filter(x => x !== currentPosTheme);
        const next = choices[Math.floor(Math.random() * choices.length)] || 'pink';
        applyPosTheme(next, true);
    }

    initPosTheme();

    let csrfToken = '';
'''
          if js_marker not in h:
              raise SystemExit('javascript theme marker not found')
          h = h.replace(js_marker, theme_js, 1)

          settings_open_old = '''        document.getElementById('newPaymentMethod').value = '';
        await Promise.all([renderPaymentMethodSettings(), loadSystemStatus()]);
        settingsModalObj.show();'''
          settings_open_new = '''        document.getElementById('newPaymentMethod').value = '';
        renderPosThemePicker();
        await Promise.all([renderPaymentMethodSettings(), loadSystemStatus()]);
        settingsModalObj.show();'''
          if settings_open_old not in h:
              raise SystemExit('open settings theme marker not found')
          h = h.replace(settings_open_old, settings_open_new, 1)

          html.write_text(h, encoding='utf-8')

          Path('version.json').write_text(json.dumps({
              'version': '1.5.5',
              'release_notes': '新增介面主題：櫻花粉、海洋藍、薄荷綠、奶茶棕、葡萄紫、深色模式，可即時切換並依每台裝置個別記憶；另有「今日心情隨機」。報表輸出仍固定原本粉色品牌。'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = Path('README.md')
          if readme.exists():
              r = readme.read_text(encoding='utf-8').replace('V1.5.4', 'V1.5.5')
              if '## V1.5.5 介面主題' not in r:
                  r += '''\n## V1.5.5 介面主題\n\n- 6 套主題：櫻花粉、海洋藍、薄荷綠、奶茶棕、葡萄紫、深色模式。\n- 主題只存在該裝置瀏覽器的 localStorage，不會互相覆蓋。\n- 設定頁可即時切換，另有「今日心情隨機」。\n- 日／月／年報表與手寫報表仍固定使用原本粉色品牌，不跟 UI 主題變色。\n'''
              readme.write_text(r, encoding='utf-8')
          PY

      - name: Validate Python JavaScript and HTML
        shell: bash
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          import re
          h = Path('templates/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', h, re.S | re.I)
          inline = '\n'.join(x for x in scripts if x.strip())
          Path('/tmp/pos-inline.js').write_text(inline, encoding='utf-8')
          ids = re.findall(r'\bid=["\']([^"\']+)["\']', h)
          dupes = sorted({x for x in ids if ids.count(x) > 1})
          assert not dupes, f'duplicate ids: {dupes}'
          assert h.count('data-pos-theme-choice=') == 6
          assert "fans_phone_pos_theme" in h
          assert "randomizePosTheme" in h
          assert '#reportCaptureArea, #handwrittenReportContainer' in h
          s = Path('app.py').read_text(encoding='utf-8')
          assert 'APP_VERSION = "1.5.5"' in s
          v = Path('version.json').read_text(encoding='utf-8')
          assert '"version": "1.5.5"' in v
          PY
          node --check /tmp/pos-inline.js

      - name: Commit V1.5.5
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/index.html version.json README.md
          git commit -m "feat: add per-device mood themes in V1.5.5"
          git push origin main
